<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puntos de dolor Anaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lista desplegable de puntos de dolor a la izquierda; esquema fijo a la derecha; pestañas de fase al final. Tema blanco único. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f3f2f8; --ink:#1c1a26; --muted:#615f72; --line:#e4e2ee;
  --accent:#6a2fe0;
  --crit:#c8102e; --alto:#ea7317; --medio:#d9a400;
  --c-bq:#7c3aed; --c-yel:#d9a521; --c-ora:#e8742a; --c-blk:#3a3748; --c-grn:#5f9a32; --c-blu:#2b8fd6; --c-red:#d93a3a; --c-pink:#cf3dbd; --c-ghost:#8a879b;
  --c-xls:#1e7a46; --c-pbi:#c9940a;
  --edge:#55526a;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sev-crit{--sev:var(--crit);--sev-on:#fff} .sev-alto{--sev:var(--alto);--sev-on:#fff} .sev-medio{--sev:var(--medio);--sev-on:var(--ink)}

.app{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.app{grid-template-columns:1fr}}

/* lista desplegable */
aside{display:flex;flex-direction:column;gap:10px;min-width:0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:32px}
.nodechip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 4px 3px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--ink)}
.nodechip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:1rem;line-height:1;padding:0 6px;border-radius:50%}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:color-mix(in srgb,var(--sev) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--sev) 35%,var(--surface));border-radius:10px;overflow:hidden;position:relative;transition:border-color .15s,box-shadow .15s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--sev)}
.card:hover{border-color:color-mix(in srgb,var(--sev) 70%,var(--surface))}
.card.open{border-color:var(--sev);box-shadow:0 0 0 1px var(--sev),0 6px 20px -10px color-mix(in srgb,var(--sev) 60%,transparent)}
.card-head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;padding:12px 14px 12px 18px;cursor:pointer}
.card-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
.card-head .t{font-weight:700;font-size:.95rem;line-height:1.3}
.card-head .chev{width:22px;height:22px;display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.card.open .card-head .chev{transform:rotate(180deg);color:var(--sev)}
.card-head .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.sevtag{font-size:.68rem;font-weight:700;color:var(--sev-on);background:var(--sev);border-radius:999px;padding:1px 9px;text-transform:uppercase;letter-spacing:.06em}
.card .tag{background:color-mix(in srgb,var(--sev) 12%,var(--surface));color:var(--ink)}
.card-body{padding:0 16px 16px 18px;display:flex;flex-direction:column;gap:2px}
.card-body h3{font-size:.68rem;font-family:var(--f-mono);font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 4px}
.card-body p{margin:0;font-size:.9rem;line-height:1.5}
.card-body .why{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1.5px solid var(--nc);background:color-mix(in srgb,var(--nc) 9%,var(--surface))}
.chip.ctx{border-style:dashed;font-weight:500;color:var(--muted);background:var(--surface)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.9rem}

.player{margin-top:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:9px;padding:12px}
.player .ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.player button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .8rem var(--f-body);padding:5px 11px;border-radius:7px;cursor:pointer}
.player button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.player button:disabled{opacity:.4;cursor:default}
.player button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;counter-reset:s}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:.85rem;color:var(--muted);line-height:1.4}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-size:.72rem;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.steps li.cur{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--sev)}
.steps li.cur::before{background:var(--sev);border-color:var(--sev);color:#fff}
.steps li:focus-visible{outline:2px solid var(--accent)}

/* zona del esquema */
main{display:flex;flex-direction:column;gap:12px;min-width:0;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:960px){main{position:static}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;min-height:32px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .82rem var(--f-body);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto;
  background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:22px 22px}
.stage svg{display:block;width:100%;min-width:760px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{flex:none}

/* SVG: zona OLA */
.zone rect{fill:color-mix(in srgb,var(--c-bq) 5%,var(--surface));stroke:color-mix(in srgb,var(--c-bq) 45%,var(--surface));stroke-width:2.5;stroke-dasharray:12 8}
.zone text{fill:var(--c-bq);font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:.06em}
svg.sel .zone{opacity:.55}

/* SVG: nodos */
.node rect.body{fill:color-mix(in srgb,var(--nc) 8%,var(--surface));stroke:var(--nc);stroke-width:3;transition:fill .25s,stroke-width .2s;filter:url(#shadow)}
.node.big rect.body{fill:color-mix(in srgb,var(--nc) 13%,var(--surface));stroke-width:4}
.node rect.cap{fill:var(--nc)}
.node text{fill:var(--ink);font-family:var(--f-body);font-weight:600;pointer-events:none}
.node{cursor:pointer;transition:opacity .25s}
.node:hover rect.body{stroke-width:5}
.node:focus{outline:none}
.node:focus-visible rect.body{stroke-dasharray:10 6}
.node rect.halo{fill:none;stroke:var(--sev,transparent);stroke-width:0;opacity:0;transition:opacity .25s}
.node .badge rect{fill:var(--ink)}
.node .badge text{fill:#fff;font-family:var(--f-mono);font-weight:500;font-size:20px}
.node.ghost rect.body{stroke:var(--c-ghost);stroke-dasharray:8 6;stroke-width:2.5;fill:var(--surface-2);filter:none}
.node.ghost rect.cap{display:none}
.node.ghost text{fill:var(--muted);font-style:italic;font-weight:500}
.node.ghost{display:none}
svg.sel .node.ghost.context,svg.sel .node.ghost.primary{display:inline}

/* SVG: conexiones */
.edge path{fill:none;stroke:var(--edge);stroke-width:3.5;stroke-linecap:round;transition:opacity .25s,stroke .25s}
.edge.dot path{stroke-dasharray:1 10;stroke-width:5}
.edge polygon{fill:var(--edge);stroke:var(--edge);stroke-width:3;stroke-linejoin:round;transition:opacity .25s}
.edge.red path{stroke:var(--c-red)} .edge.red polygon{fill:var(--c-red);stroke:var(--c-red)}
.edge.ghost{display:none}
.edge.ghost path{stroke:var(--c-ghost);stroke-dasharray:6 8;stroke-width:3}
.edge.ghost polygon{fill:var(--c-ghost);stroke:var(--c-ghost)}

svg.sel .node{opacity:.18}
svg.sel .edge{opacity:.1}
svg.sel .node.primary,svg.sel .node.context{opacity:1}
svg.sel .node.primary rect.body{fill:color-mix(in srgb,var(--sev) 15%,var(--surface))}
svg.sel .node.primary rect.halo{stroke-width:4;opacity:.85}
svg.sel .node.context rect.body{stroke-dasharray:12 7}
svg.sel .node .badge{opacity:0}
svg.sel .edge.on{opacity:.7}
svg.sel .edge.ghost.on{display:inline}
svg.sel .edge.flow{opacity:1}
svg.sel .edge.flow path{stroke:var(--sev);stroke-dasharray:14 10;stroke-width:5;animation:dash .9s linear infinite}
svg.sel .edge.flow polygon{fill:var(--sev);stroke:var(--sev)}
svg.sel .node.step rect.body{stroke-width:6}
svg.sel .node.primary.step rect.body{fill:color-mix(in srgb,var(--sev) 28%,var(--surface))}
@keyframes dash{to{stroke-dashoffset:-24}}
.pulse{fill:var(--sev);stroke:#fff;stroke-width:3;pointer-events:none}

svg.heat .node:not(.ghost) rect.body{fill:color-mix(in srgb,var(--crit) var(--heat,0%),var(--surface))}
svg.heat .edge{opacity:.25}
svg.heat .node.zero{opacity:.35}
svg.focusnode .node.nodefocus rect.body{stroke-width:7}

/* ranking del mapa de calor */
.rankbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.rankbox h2{font-family:var(--f-display);font-size:1.1rem;font-weight:800;margin:0}
.rankbox p{margin:0;color:var(--muted);font-size:.86rem;max-width:80ch}
.rankwrap{overflow-x:auto}
table.rank{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
table.rank td,table.rank th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.rank th{font-family:var(--f-mono);font-weight:500;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.rank .barc{width:45%}
table.rank .b{height:8px;border-radius:4px;background:var(--crit)}
table.rank tr[data-n]{cursor:pointer}
table.rank tr[data-n]:hover td{background:var(--surface-2)}

/* pestañas de fase (al final) */
.phasebar{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:4px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:transparent;color:var(--muted);font:600 .88rem var(--f-body);padding:11px 14px 10px;cursor:pointer;white-space:nowrap;border-top:3px solid transparent;display:inline-flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-top-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:.7rem;font-weight:500;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:1px 7px}
.tab[aria-selected="true"] .n{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tab .k{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.phase-desc{margin:0;color:var(--muted);font-size:.9rem;min-height:1.4em;padding-left:14px}
@media (prefers-reduced-motion:reduce){svg.sel .edge.flow path{animation:none}.pulse{display:none}.card-head .chev{transition:none}}
</style>
</head><body>

<div class="wrap">
  <div class="app">
    <aside>
      <div class="list-head"><span class="eyebrow" id="listcount">Puntos de dolor</span><span id="nodefilter"></span></div>
      <div class="cards" id="cards"></div>
    </aside>

    <main>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Vista">
          <button id="m-dolor" aria-pressed="true">Por punto de dolor</button>
          <button id="m-calor" aria-pressed="false">Mapa de calor</button>
        </div>
      </div>
      <div class="stage"><svg id="map" viewBox="0 0 1800 1010" role="img" aria-label="Esquema del ecosistema Anaya">
        <defs><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2a2340" flood-opacity=".12"/></filter></defs>
      </svg></div>
      <div class="legend">
        <span><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="var(--edge)" stroke-width="3" stroke-linecap="round"/></svg>Conexión continua</span>
        <span><svg width="34" height="10"><line x1="3" y1="5" x2="32" y2="5" stroke="var(--edge)" stroke-width="4" stroke-dasharray="1 7" stroke-linecap="round"/></svg>Conexión punteada</span>
        <span><svg width="34" height="14"><rect x="2" y="2" width="30" height="10" rx="5" fill="var(--surface)" stroke="var(--crit)" stroke-width="2"/></svg>Implicado en el proceso</span>
        <span><svg width="34" height="14"><rect x="2" y="2" width="30" height="10" rx="5" fill="var(--surface)" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 3"/></svg>Contexto del flujo</span>
        <span><svg width="34" height="14"><rect x="2" y="2" width="30" height="10" rx="5" fill="var(--surface-2)" stroke="var(--c-ghost)" stroke-width="2" stroke-dasharray="3 3"/></svg>Fuera del esquema (Teams, Vimeo…)</span>
      </div>
      <section class="rankbox" id="rank" hidden></section>
    </main>
  </div>

  <div class="phasebar">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Fases"></nav>
    <p class="phase-desc" id="phasedesc"></p>
  </div>
</div>

<script>
(function(){
/* Nodos: x,y = centro; w,h = tamaño; c = color; l = etiqueta (\n = salto) */
const NODES = {
  // zona OLA (BQ)
  dambq:{x:900,y:215,w:230,h:70,c:'--c-bq',l:'DAM'},
  ha:{x:900,y:390,w:380,h:120,c:'--c-bq',l:'Herramienta autora',big:1},
  ola:{x:900,y:630,w:380,h:120,c:'--c-bq',l:'LMS',big:1},
  gen:{x:900,y:870,w:340,h:100,c:'--c-bq',l:'Generador de\nevaluaciones y fichas'},
  // origen de contenidos
  genially:{x:200,y:100,w:200,h:70,c:'--c-pink',l:'Genially'},
  nexus:{x:430,y:300,w:210,h:70,c:'--c-grn',l:'DAM (Nexus)'},
  gade:{x:145,y:480,w:230,h:84,c:'--c-yel',l:'Contenidos papel\n(GADE)'},
  a2r:{x:450,y:480,w:270,h:84,c:'--c-blu',l:'Traducción y otras\nfunciones IA (A2R)'},
  prog:{x:145,y:730,w:250,h:84,c:'--c-red',l:'Programaciones IA\n(1MillionBot)'},
  mem:{x:450,y:730,w:270,h:84,c:'--c-yel',l:'Almacén de recursos\ndigitales (MEM)'},
  excel:{x:145,y:920,w:200,h:70,c:'--c-xls',l:'Excel'},
  powerbi:{x:450,y:920,w:200,h:70,c:'--c-pbi',l:'Power BI'},
  // distribución
  dist:{x:1420,y:390,w:280,h:100,c:'--c-yel',l:'Distribuidor\ndigital'},
  ccaa:{x:1320,y:150,w:280,h:100,c:'--c-ora',l:'Plataforma\nCCAA/colegio'},
  otros:{x:1625,y:150,w:300,h:120,c:'--c-ora',l:'Otros (cliente\nfinal, familia,\nacademia…)'},
  beta:{x:1705,y:390,w:160,h:80,c:'--c-yel',l:'BETA'},
  garec:{x:1695,y:560,w:190,h:70,c:'--c-yel',l:'GA Recursos'},
  oracle:{x:1360,y:650,w:190,h:70,c:'--c-blk',l:'Oracle'},
  sf:{x:1570,y:650,w:200,h:84,c:'--c-blk',l:'Salesforce +\nMylead'},
  // fuera del esquema: solo aparecen cuando un punto de dolor los usa
  servidor:{x:560,y:48,w:260,h:60,c:'--c-ghost',l:'Servidor de recursos',ghost:1},
  vimeo:{x:590,y:880,w:130,h:60,c:'--c-ghost',l:'Vimeo',ghost:1},
  teams:{x:1330,y:920,w:290,h:60,c:'--c-ghost',l:'Teams · Excel seguim.',ghost:1},
  blink:{x:1330,y:790,w:140,h:60,c:'--c-ghost',l:'Blink',ghost:1}
};
const FS=25; // tamaño único para todas las etiquetas
const ZONE={x:670,y:70,w:460,h:900,l:'OLA (BQ)'};

/* Conexiones: sa/sb = lado de salida/llegada (l,r,t,b), oa/ob = desplazamiento a lo largo del lado, k = curvatura */
const EDGES = {
  e_dambq_ha:{a:'dambq',b:'ha',arrow:'end'},
  e_ha_ola:{a:'ha',b:'ola',arrow:'both'},
  e_gen_ola:{a:'gen',b:'ola',arrow:'end'},
  e_gen_ha:{a:'genially',b:'ha',dot:1,arrow:'end',sa:'r',sb:'t',ob:-.32,k:170},
  e_nexus_ha:{a:'nexus',b:'ha',dot:1,arrow:'end',sa:'r',sb:'l',ob:-.12},
  e_gade_ha:{a:'gade',b:'ha',dot:1,arrow:'end',sa:'t',sb:'l',oa:.2,ob:.12,k:70},
  e_mem_ha:{a:'mem',b:'ha',dot:1,arrow:'end',sa:'r',sb:'l',ob:.3},
  e_nexus_a2r:{a:'nexus',b:'a2r',dot:1,arrow:'both'},
  e_a2r_mem:{a:'a2r',b:'mem',dot:1,arrow:'end'},
  e_prog_mem:{a:'prog',b:'mem',dot:1,arrow:'end'},
  e_gade_a2r:{a:'gade',b:'a2r',dot:1,arrow:'end'},
  e_gade_prog:{a:'gade',b:'prog',arrow:'end'},
  e_ha_dist:{a:'ha',b:'dist',arrow:'end'},
  e_dist_ccaa:{a:'dist',b:'ccaa',arrow:'end',oa:-.2},
  e_dist_otros:{a:'dist',b:'otros',arrow:'end',oa:.2,sb:'b'},
  e_dist_beta:{a:'dist',b:'beta',arrow:'end'},
  e_garec_beta:{a:'garec',b:'beta',arrow:'end',oa:-.05},
  e_oracle_dist:{a:'oracle',b:'dist',arrow:'end',sa:'t',sb:'b',ob:-.22},
  e_sf_dist:{a:'sf',b:'dist',arrow:'end',sa:'t',sb:'b',ob:.22},
  // conexiones de flujo que no están en el esquema original
  g_serv_dambq:{a:'servidor',b:'dambq',ghost:1,arrow:'end',sa:'r',sb:'t',oa:0},
  g_ha_teams:{a:'ha',b:'teams',ghost:1,arrow:'end',sa:'r',sb:'l',oa:.35,ob:-.2,k:260},
  g_ola_teams:{a:'ola',b:'teams',ghost:1,arrow:'end',sa:'r',sb:'l',oa:.3,ob:.2},
  g_mem_vimeo:{a:'mem',b:'vimeo',ghost:1,arrow:'end',sa:'b',sb:'l'},
  g_vimeo_ha:{a:'vimeo',b:'ha',ghost:1,arrow:'end',sa:'t',sb:'l',ob:.46,k:140},
  g_gade_nexus:{a:'gade',b:'nexus',ghost:1,arrow:'both',sa:'t',sb:'l',oa:-.25},
  g_blink_ola:{a:'blink',b:'ola',ghost:1,arrow:'end',sa:'l',sb:'r',ob:.25}
};

const PHASES = {
  1:{s:'Conceptualización',l:'Conceptualización de campaña y plan editorial.'},
  2:{s:'Creación de contenidos',l:'Creación de contenidos, incluyendo reutilización, adaptación y producción nueva, y empaquetado de producto digital.'},
  3:{s:'Distribución',l:'Distribución y puesta a disposición en plataformas.'},
  4:{s:'Consumo en aula',l:'Consumo en aula, seguimiento y atención a los usuarios.'}
};
const SEV = {crit:{l:'Crítico',w:3},alto:{l:'Alto',w:2},medio:{l:'Medio',w:1}};

const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map');
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const label=n=>n.l.replace(/\n/g,' ');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RX=n=>Math.min(n.h/2,22);

// zona OLA
const gZ=el('g',{class:'zone'},svg);
el('rect',{x:ZONE.x,y:ZONE.y,width:ZONE.w,height:ZONE.h,rx:36},gZ);
el('text',{x:ZONE.x+28,y:ZONE.y+52},gZ).textContent=ZONE.l;

// geometría de conexiones: salen y llegan por el centro de un lado, con curvas suaves
const DIR={l:[-1,0],r:[1,0],t:[0,-1],b:[0,1]};
function anchor(n,side,off=0){const g=5;
  if(side==='l')return [n.x-n.w/2-g,n.y+off*n.h];
  if(side==='r')return [n.x+n.w/2+g,n.y+off*n.h];
  if(side==='t')return [n.x+off*n.w,n.y-n.h/2-g];
  return [n.x+off*n.w,n.y+n.h/2+g];}
function sides(A,B){const dx=B.x-A.x,dy=B.y-A.y;
  return Math.abs(dx)>Math.abs(dy)*1.1?(dx>0?['r','l']:['l','r']):(dy>0?['b','t']:['t','b']);}
function arrowAt(p,d,g){const len=17,w=8,ux=-d[0],uy=-d[1];
  el('polygon',{points:`${p[0]},${p[1]} ${p[0]-ux*len-uy*w},${p[1]-uy*len+ux*w} ${p[0]-ux*len+uy*w},${p[1]-uy*len-ux*w}`},g);}

const gE=el('g',{},svg), gN=el('g',{},svg), gP=el('g',{},svg);
const edgeEls={}, nodeEls={};
for(const id in EDGES){const e=EDGES[id],A=NODES[e.a],B=NODES[e.b];
  const auto=sides(A,B),sa=e.sa||auto[0],sb=e.sb||auto[1];
  const s=anchor(A,sa,e.oa||0),t=anchor(B,sb,e.ob||0),da=DIR[sa],db=DIR[sb];
  const dist=Math.hypot(t[0]-s[0],t[1]-s[1]),k=e.k||Math.max(30,Math.min(180,dist*.42));
  const trimS=e.arrow==='both'?12:0,trimT=e.arrow==='none'?0:12;
  const s2=[s[0]+da[0]*trimS,s[1]+da[1]*trimS],t2=[t[0]+db[0]*trimT,t[1]+db[1]*trimT];
  const c1=[s[0]+da[0]*k,s[1]+da[1]*k],c2=[t[0]+db[0]*k,t[1]+db[1]*k];
  const g=el('g',{class:'edge'+(e.dot?' dot':'')+(e.ghost?' ghost':'')+(e.color?' '+e.color:'')},gE);
  const p=el('path',{d:`M${s2} C${c1} ${c2} ${t2}`},g);
  if(e.arrow!=='none')arrowAt(t,db,g);
  if(e.arrow==='both')arrowAt(s,da,g);
  edgeEls[id]={g,p};
}
for(const id in NODES){const n=NODES[id],rx=RX(n);
  const g=el('g',{class:'node'+(n.big?' big':'')+(n.ghost?' ghost':''),tabindex:n.ghost?-1:0,role:'button','aria-label':label(n),style:`--nc:var(${n.c})`},gN);
  el('rect',{class:'halo',x:n.x-n.w/2-11,y:n.y-n.h/2-11,width:n.w+22,height:n.h+22,rx:rx+11},g);
  el('rect',{class:'body',x:n.x-n.w/2,y:n.y-n.h/2,width:n.w,height:n.h,rx},g);
  el('rect',{class:'cap',x:n.x-n.w*.18,y:n.y-n.h/2+7,width:n.w*.36,height:5,rx:2.5},g);
  const lines=n.l.split('\n'),lh=FS*1.18,y0=n.y-(lines.length-1)*lh/2+FS*0.36+3;
  const tx=el('text',{'text-anchor':'middle','font-size':FS},g);
  lines.forEach((l,i)=>{const ts=el('tspan',{x:n.x,y:y0+i*lh},tx);ts.textContent=l;});
  const b=el('g',{class:'badge'},g);
  const bx=n.x+n.w/2-10,by=n.y-n.h/2-2;
  el('rect',{x:bx-17,y:by-15,width:34,height:30,rx:15},b);const bt=el('text',{x:bx,y:by+7,'text-anchor':'middle'},b);
  nodeEls[id]={g,bt,b};
  if(!n.ghost){g.addEventListener('click',()=>toggleNode(id));
    g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggleNode(id);}});}
}

// ---- estado
const S={mode:'dolor',sel:null,step:-1,phase:null,node:null,playing:false,timer:null};
try{const h=location.hash.slice(1);if(PAINS.some(p=>p.id===h))S.sel=h;else if(/^fase[1-4]$/.test(h))S.phase=+h.slice(4);}catch(e){}

const inPhase=p=>!S.phase||p.ph.includes(S.phase);
const visible=()=>PAINS.filter(p=>inPhase(p)&&(!S.node||p.nodes.includes(S.node)||p.ctx.includes(S.node)));
const pain=()=>PAINS.find(p=>p.id===S.sel);

// pestañas de fase
const tabs=document.getElementById('tabs');
function renderTabs(){tabs.innerHTML='';
  [null,1,2,3,4].forEach(v=>{const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');
    b.setAttribute('aria-selected',String(S.phase===v));b.tabIndex=S.phase===v?0:-1;
    const n=v?PAINS.filter(p=>p.ph.includes(v)).length:PAINS.length;
    b.innerHTML=v?`<span class="k">${v}</span>${PHASES[v].s}<span class="n">${n}</span>`:`Todas las fases<span class="n">${n}</span>`;
    b.onclick=()=>setPhase(v);
    b.onkeydown=e=>{const order=[null,1,2,3,4],i=order.indexOf(S.phase);
      if(e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();setPhase(order[(i+1)%5]);tabs.querySelector('[aria-selected="true"]').focus();}
      if(e.key==='ArrowLeft'){e.preventDefault();e.stopPropagation();setPhase(order[(i+4)%5]);tabs.querySelector('[aria-selected="true"]').focus();}};
    tabs.appendChild(b);});
  document.getElementById('phasedesc').textContent=S.phase?PHASES[S.phase].l:'';}
function setPhase(v){S.phase=v;if(S.sel&&!visible().some(p=>p.id===S.sel))select(null);render();}

document.getElementById('m-dolor').onclick=()=>{S.mode='dolor';render();};
document.getElementById('m-calor').onclick=()=>{S.mode='calor';stop();render();};

function toggleNode(id){S.node=S.node===id?null:id;if(S.sel&&!visible().some(p=>p.id===S.sel))select(null);render();}
function select(id){stop();S.sel=id;S.step=-1;if(id)S.mode='dolor';}

function stop(){S.playing=false;clearTimeout(S.timer);}
function play(){const p=pain();if(!p)return;S.playing=true;
  if(S.step>=p.steps.length-1)S.step=-1;
  const tick=()=>{if(!S.playing)return;S.step++;render();
    if(S.step<p.steps.length-1)S.timer=setTimeout(tick,3200);else{S.playing=false;render();}};
  tick();}

function chips(ids,ctx){return ids.map(n=>`<span class="chip${ctx?' ctx':''}" style="--nc:var(${NODES[n].c})">${esc(label(NODES[n]))}</span>`).join('');}
const CHEV='<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// ---- lista desplegable
function renderCards(){
  const list=visible(),box=document.getElementById('cards');box.innerHTML='';
  document.getElementById('listcount').textContent=`${list.length} de ${PAINS.length} puntos de dolor`;
  const nf=document.getElementById('nodefilter');nf.innerHTML='';
  if(S.node){const c=document.createElement('span');c.className='nodechip';c.textContent=label(NODES[S.node]);
    const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Quitar filtro');x.onclick=()=>{S.node=null;render();};c.appendChild(x);nf.appendChild(c);}
  if(!list.length){const e=document.createElement('div');e.className='empty';
    e.textContent=S.phase===4&&!S.node?'El documento todavía no recoge puntos de dolor para la fase 4.':'Ningún punto de dolor coincide con este filtro.';box.appendChild(e);return;}
  list.forEach(p=>{const open=S.sel===p.id&&S.mode==='dolor';
    const card=document.createElement('div');card.className='card sev-'+p.sev+(open?' open':'');
    card.innerHTML=`<button class="card-head" aria-expanded="${open}" aria-controls="body-${p.id}">
        <span class="t">${esc(p.t)}</span><span class="chev">${CHEV}</span>
        <span class="meta"><span class="sevtag">${SEV[p.sev].l}</span>${p.ph.map(f=>`<span class="tag">Fase ${f}</span>`).join('')}<span class="tag">${p.nodes.length} elem.</span></span>
      </button>`;
    card.querySelector('.card-head').onclick=()=>{select(open?null:p.id);render();if(!open)requestAnimationFrame(()=>{const c=document.querySelector('.card.open');if(c&&c.getBoundingClientRect().top<0)c.scrollIntoView({block:'start',behavior:'smooth'});});};
    if(open)card.appendChild(cardBody(p));
    box.appendChild(card);});
}

function cardBody(p){
  const b=document.createElement('div');b.className='card-body';b.id='body-'+p.id;
  b.innerHTML=`<h3>Descripción</h3><p>${esc(p.d)}</p>
    <h3>Por qué es un problema</h3><p class="why">${esc(p.why)}</p>
    <h3>Elementos implicados</h3><div class="chips">${chips(p.nodes)}</div>
    ${p.ctx.length?`<h3>Contexto del flujo</h3><div class="chips">${chips(p.ctx,1)}</div>`:''}
    <div class="player">
      <div class="ctrls">
        <button class="primary" data-a="pl">${S.playing?'Pausar':(S.step>=p.steps.length-1?'Repetir':'Reproducir flujo')}</button>
        <button data-a="pv" ${S.step<0?'disabled':''} aria-label="Paso anterior">‹</button>
        <button data-a="nx" ${S.step>=p.steps.length-1?'disabled':''} aria-label="Paso siguiente">›</button>
        <button data-a="ov" ${S.step<0?'disabled':''}>Vista general</button>
      </div>
      <div class="eyebrow">${S.step<0?'Vista general · '+p.steps.length+' pasos':'Paso '+(S.step+1)+' de '+p.steps.length}</div>
      <ol class="steps">${p.steps.map((s,i)=>`<li tabindex="0" class="${i===S.step?'cur':''}">${esc(s.t)}</li>`).join('')}</ol>
    </div>`;
  b.querySelectorAll('.steps li').forEach((li,i)=>{const go=()=>{stop();S.step=i;render();};li.onclick=go;li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
  const A={pl:()=>{S.playing?stop():play();},pv:()=>{stop();S.step=Math.max(-1,S.step-1);},nx:()=>{stop();S.step=Math.min(p.steps.length-1,S.step+1);},ov:()=>{stop();S.step=-1;}};
  b.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{A[x.dataset.a]();render();});
  return b;
}

// ---- esquema
function renderMap(){
  const p=S.mode==='dolor'?pain():null;
  svg.setAttribute('class',(p?'sel sev-'+p.sev:'')+(S.mode==='calor'?' heat':'')+(S.node?' focusnode':''));
  const allE=new Set(),stepE=new Set(),stepN=new Set();
  if(p){p.steps.forEach(s=>s.e.forEach(x=>allE.add(x)));
    const cur=p.steps[S.step];if(cur){cur.e.forEach(x=>{stepE.add(x);stepN.add(EDGES[x].a);stepN.add(EDGES[x].b);});(cur.f||[]).forEach(n=>stepN.add(n));}}
  for(const id in edgeEls){const g=edgeEls[id].g;g.classList.toggle('on',allE.has(id));g.classList.toggle('flow',stepE.has(id));}
  const vis=S.mode==='calor'?PAINS.filter(inPhase):visible();
  const score={},count={};
  vis.forEach(q=>q.nodes.forEach(n=>{score[n]=(score[n]||0)+SEV[q.sev].w;count[n]=(count[n]||0)+1;}));
  const max=Math.max(1,...Object.values(score));
  for(const id in nodeEls){const {g,bt,b}=nodeEls[id];
    g.classList.toggle('primary',!!p&&p.nodes.includes(id));
    g.classList.toggle('context',!!p&&p.ctx.includes(id));
    g.classList.toggle('step',stepN.has(id));
    g.classList.toggle('nodefocus',S.node===id);
    g.classList.toggle('zero',!score[id]);
    const v=S.mode==='calor'?score[id]:count[id];
    b.style.display=v&&!NODES[id].ghost?'':'none';bt.textContent=v||'';
    g.style.setProperty('--heat',Math.round((score[id]||0)/max*62)+'%');
    g.style.setProperty('--sev',p?`var(--${p.sev})`:'transparent');
  }
  svg.style.setProperty('--sev',p?`var(--${p.sev})`:'var(--accent)');
  startPulses([...stepE]);
}

let raf=null,pulses=[];
function startPulses(ids){cancelAnimationFrame(raf);gP.innerHTML='';pulses=[];
  if(!ids.length||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  ids.forEach(id=>{const e=EDGES[id],path=edgeEls[id].p,L=path.getTotalLength();
    for(let k=0;k<2;k++){const c=el('circle',{r:9,class:'pulse'},gP);pulses.push({c,path,L,off:k*0.5,both:e.arrow==='both'});}});
  const t0=performance.now();
  const loop=now=>{const t=((now-t0)/1600)%1;
    pulses.forEach(q=>{let u=(t+q.off)%1;if(q.both&&q.off)u=1-u;const pt=q.path.getPointAtLength(u*q.L);q.c.setAttribute('cx',pt.x);q.c.setAttribute('cy',pt.y);q.c.setAttribute('opacity',Math.sin(u*Math.PI).toFixed(2));});
    raf=requestAnimationFrame(loop);};
  raf=requestAnimationFrame(loop);}

// ---- ranking del mapa de calor
function renderRank(){
  const r=document.getElementById('rank');r.hidden=S.mode!=='calor';if(r.hidden)return;
  const rows={};PAINS.filter(inPhase).forEach(q=>q.nodes.forEach(n=>{rows[n]=rows[n]||{s:0,c:0};rows[n].s+=SEV[q.sev].w;rows[n].c++;}));
  const arr=Object.entries(rows).sort((a,b)=>b[1].s-a[1].s);const max=arr.length?arr[0][1].s:1;
  r.innerHTML=`<h2>Dónde se concentra el dolor${S.phase?' · fase '+S.phase:''}</h2>
    <p>Cada elemento suma el peso de los puntos de dolor que lo implican: crítico 3, alto 2, medio 1. Solo cuentan los elementos implicados según el documento.</p>
    <div class="rankwrap">${arr.length?`<table class="rank"><thead><tr><th>Elemento</th><th>Puntos</th><th>Peso</th><th class="barc"></th></tr></thead><tbody>
    ${arr.map(([n,v])=>`<tr data-n="${n}"><td><span class="chip" style="--nc:var(${NODES[n].c})">${esc(label(NODES[n]))}</span></td><td>${v.c}</td><td><b>${v.s}</b></td><td class="barc"><div class="b" style="width:${v.s/max*100}%"></div></td></tr>`).join('')}
    </tbody></table>`:'<div class="empty">No hay puntos de dolor en esta fase.</div>'}</div>`;
  r.querySelectorAll('tr[data-n]').forEach(tr=>tr.onclick=()=>{S.node=tr.dataset.n;S.mode='dolor';render();});
}

function render(){
  document.getElementById('m-dolor').setAttribute('aria-pressed',String(S.mode==='dolor'));
  document.getElementById('m-calor').setAttribute('aria-pressed',String(S.mode==='calor'));
  renderTabs();renderCards();renderMap();renderRank();
}
document.addEventListener('keydown',e=>{const p=pain();if(!p||S.mode!=='dolor'||e.target.closest('.tabs'))return;
  if(e.key==='ArrowRight'){stop();S.step=Math.min(p.steps.length-1,S.step+1);render();}
  if(e.key==='ArrowLeft'){stop();S.step=Math.max(-1,S.step-1);render();}
  if(e.key==='Escape'){select(null);render();}});
render();
})();
</script>
</body></html>
