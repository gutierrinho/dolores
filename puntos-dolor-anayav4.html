<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puntos de dolor Anaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: el esquema ocupa todo el ancho; la lista de puntos de dolor se abre a la izquierda y con ella aparecen las fases al final. Tema blanco único. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f3f2f8; --ink:#1c1a26; --muted:#615f72; --line:#e4e2ee;
  --accent:#6a2fe0;
  --crit:#c8102e; --alto:#ea7317; --medio:#d9a400;
  --c-bq:#7c3aed; --c-yel:#d9a521; --c-ora:#e8742a; --c-blk:#3a3748; --c-grn:#5f9a32; --c-blu:#2b8fd6; --c-red:#d93a3a; --c-pink:#cf3dbd; --c-ghost:#8a879b;
  --c-xls:#1e7a46; --c-pbi:#c9940a;
  --edge:#55526a;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sev-crit{--sev:var(--crit);--sev-on:#fff} .sev-alto{--sev:var(--alto);--sev-on:#fff} .sev-medio{--sev:var(--medio);--sev-on:var(--ink)}

/* botón para abrir y cerrar la lista */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:40px}
.listtoggle{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 .92rem var(--f-body);padding:8px 14px 8px 12px;border-radius:10px;cursor:pointer;box-shadow:0 1px 2px rgba(28,26,38,.06);transition:border-color .15s,background .15s}
.listtoggle:hover{border-color:var(--accent)}
.listtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.listtoggle .chev{display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.listtoggle[aria-expanded="true"]{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-color:color-mix(in srgb,var(--accent) 40%,var(--surface))}
.listtoggle[aria-expanded="true"] .chev{transform:rotate(180deg);color:var(--accent)}
.listtoggle .dots{display:inline-flex;gap:3px}
.listtoggle .dots i{width:9px;height:9px;border-radius:50%;background:var(--sev)}
.listtoggle .n{font-family:var(--f-mono);font-weight:500;font-size:.75rem;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 8px}
.nodechip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 4px 3px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--ink)}
.nodechip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:1rem;line-height:1;padding:0 6px;border-radius:50%}

.app{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.app.open{grid-template-columns:minmax(300px,400px) minmax(0,1fr)}
@media (max-width:960px){.app.open{grid-template-columns:1fr}}

/* lista desplegable */
aside{display:flex;flex-direction:column;gap:8px;min-width:0}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:color-mix(in srgb,var(--sev) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--sev) 35%,var(--surface));border-radius:10px;overflow:hidden;position:relative;transition:border-color .15s,box-shadow .15s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--sev)}
.card:hover{border-color:color-mix(in srgb,var(--sev) 70%,var(--surface))}
.card.open{border-color:var(--sev);box-shadow:0 0 0 1px var(--sev),0 6px 20px -10px color-mix(in srgb,var(--sev) 60%,transparent)}
.card-head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;padding:12px 14px 12px 18px;cursor:pointer}
.card-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
.card-head .t{font-weight:700;font-size:.95rem;line-height:1.3}
.card-head .chev{width:22px;height:22px;display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.card.open .card-head .chev{transform:rotate(180deg);color:var(--sev)}
.card-head .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--sev) 12%,var(--surface));color:var(--ink)}
.sevtag{font-size:.68rem;font-weight:700;color:var(--sev-on);background:var(--sev);border-radius:999px;padding:1px 9px;text-transform:uppercase;letter-spacing:.06em}
.card-body{padding:0 16px 16px 18px;display:flex;flex-direction:column;gap:2px}
.card-body h3{font-size:.68rem;font-family:var(--f-mono);font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 4px}
.card-body p{margin:0;font-size:.9rem;line-height:1.5}
.card-body .why{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1.5px solid var(--nc);background:color-mix(in srgb,var(--nc) 9%,var(--surface))}
.chip.ctx{border-style:dashed;font-weight:500;color:var(--muted);background:var(--surface)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.9rem}

/* zona del esquema */
main{display:flex;flex-direction:column;gap:12px;min-width:0}
.app.open main{position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:960px){.app.open main{position:static}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto;
  background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:22px 22px}
.stage svg{display:block;width:100%;min-width:760px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{flex:none}

/* SVG: zona OLA */
.zone rect{fill:color-mix(in srgb,var(--c-bq) 5%,var(--surface));stroke:color-mix(in srgb,var(--c-bq) 45%,var(--surface));stroke-width:2.5;stroke-dasharray:12 8}
.zone text{fill:var(--c-bq);font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:.06em}
svg.sel .zone{opacity:.55}

/* SVG: nodos */
.node rect.body{fill:color-mix(in srgb,var(--nc) 8%,var(--surface));stroke:var(--nc);stroke-width:3;transition:fill .25s,stroke-width .2s;filter:url(#shadow)}
.node.big rect.body{fill:color-mix(in srgb,var(--nc) 13%,var(--surface));stroke-width:4}
.node rect.cap{fill:var(--nc)}
.node text{fill:var(--ink);font-family:var(--f-body);font-weight:600;pointer-events:none}
.node{cursor:pointer;transition:opacity .25s}
.node:hover rect.body{stroke-width:5}
.node:focus{outline:none}
.node:focus-visible rect.body{stroke-dasharray:10 6}
.node rect.halo{fill:none;stroke:var(--sev,transparent);stroke-width:0;opacity:0;transition:opacity .25s}
.node .badge rect{fill:var(--ink)}
.node .badge text{fill:#fff;font-family:var(--f-mono);font-weight:500;font-size:20px}
.node.ghost rect.body{stroke:var(--c-ghost);stroke-dasharray:8 6;stroke-width:2.5;fill:var(--surface-2);filter:none}
.node.ghost rect.cap{display:none}
.node.ghost text{fill:var(--muted);font-style:italic;font-weight:500}
.node.ghost{display:none}
svg.sel .node.ghost.context,svg.sel .node.ghost.primary{display:inline}

/* SVG: conexiones */
.edge path{fill:none;stroke:var(--edge);stroke-width:3.5;stroke-linecap:round;transition:opacity .25s,stroke .25s}
.edge.dot path{stroke-dasharray:1 10;stroke-width:5}
.edge polygon{fill:var(--edge);stroke:var(--edge);stroke-width:3;stroke-linejoin:round;transition:opacity .25s}
.edge.ghost{display:none}
.edge.ghost path{stroke:var(--c-ghost);stroke-dasharray:6 8;stroke-width:3}
.edge.ghost polygon{fill:var(--c-ghost);stroke:var(--c-ghost)}

svg.sel .node{opacity:.18}
svg.sel .edge{opacity:.1}
svg.sel .node.primary,svg.sel .node.context{opacity:1}
svg.sel .node.primary rect.body{fill:color-mix(in srgb,var(--sev) 15%,var(--surface))}
svg.sel .node.primary rect.halo{stroke-width:4;opacity:.85}
svg.sel .node.context rect.body{stroke-dasharray:12 7}
svg.sel .edge.on{opacity:1}
svg.sel .edge.on path{stroke:var(--sev);stroke-width:4.5}
svg.sel .edge.on.dot path{stroke-width:6}
svg.sel .edge.on polygon{fill:var(--sev);stroke:var(--sev)}
svg.sel .edge.ghost.on{display:inline}
svg.focusnode .node.nodefocus rect.body{stroke-width:7}
svg:not(.counts) .node .badge,svg.sel .node .badge{display:none}

/* pestañas de fase (al final, solo con la lista abierta) */
.phasebar{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:4px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:transparent;color:var(--muted);font:600 .88rem var(--f-body);padding:11px 14px 10px;cursor:pointer;white-space:nowrap;border-top:3px solid transparent;display:inline-flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-top-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:.7rem;font-weight:500;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:1px 7px}
.tab[aria-selected="true"] .n{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tab .k{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.phase-desc{margin:0;color:var(--muted);font-size:.9rem;min-height:1.4em;padding-left:14px}
@media (prefers-reduced-motion:reduce){.card-head .chev,.listtoggle .chev{transition:none}}
</style>
</head><body>

<div class="wrap">
  <div class="topbar">
    <button class="listtoggle" id="toggle" aria-expanded="false" aria-controls="list">
      <span class="dots"><i class="sev-crit"></i><i class="sev-alto"></i><i class="sev-medio"></i></span>
      Puntos de dolor <span class="n" id="listcount">7</span>
      <span class="chev"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
    <span id="nodefilter"></span>
  </div>

  <div class="app" id="app">
    <aside id="list" hidden>
      <div class="cards" id="cards"></div>
    </aside>

    <main>
      <div class="stage"><svg id="map" viewBox="0 0 1800 1010" role="img" aria-label="Esquema del ecosistema Anaya">
        <defs><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2a2340" flood-opacity=".12"/></filter></defs>
      </svg></div>
      <div class="legend">
        <span><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="var(--edge)" stroke-width="3" stroke-linecap="round"/></svg>Conexión continua</span>
        <span><svg width="34" height="10"><line x1="3" y1="5" x2="32" y2="5" stroke="var(--edge)" stroke-width="4" stroke-dasharray="1 7" stroke-linecap="round"/></svg>Conexión punteada</span>
        <span><svg width="34" height="14"><rect x="2" y="2" width="30" height="10" rx="5" fill="var(--surface)" stroke="var(--crit)" stroke-width="2"/></svg>Implicado en el proceso</span>
        <span><svg width="34" height="14"><rect x="2" y="2" width="30" height="10" rx="5" fill="var(--surface)" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 3"/></svg>Contexto del flujo</span>
        <span><svg width="34" height="14"><rect x="2" y="2" width="30" height="10" rx="5" fill="var(--surface-2)" stroke="var(--c-ghost)" stroke-width="2" stroke-dasharray="3 3"/></svg>Fuera del esquema (Teams, Vimeo…)</span>
      </div>
    </main>
  </div>

  <div class="phasebar" id="phasebar" hidden>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Fases"></nav>
    <p class="phase-desc" id="phasedesc"></p>
  </div>
</div>

<script>
/* Escala todo el simulador según el ancho disponible (diseñado para 1440 px), para que llene marcos grandes como el lienzo de Genially */

  function fit(){const z=Math.max(1,Math.min(2.2,window.innerWidth/BASE));document.documentElement.style.zoom=z;}
  fit();window.addEventListener('resize',fit);})();
(function(){
/* Nodos: x,y = centro; w,h = tamaño; c = color; l = etiqueta (\n = salto) */
const NODES = {

};
const FS=25; // tamaño único para todas las etiquetas
const ZONE={x:670,y:70,w:460,h:900,l:'OLA (BQ)'};

/* Conexiones: sa/sb = lado de salida/llegada (l,r,t,b), oa/ob = desplazamiento a lo largo del lado, k = curvatura */
const EDGES = {
  e_dambq_ha:{a:'dambq',b:'ha',arrow:'end'},
  e_ha_ola:{a:'ha',b:'ola',arrow:'both'},
  e_gen_ola:{a:'gen',b:'ola',arrow:'end'},
  e_gen_ha:{a:'genially',b:'ha',dot:1,arrow:'end',sa:'r',sb:'t',ob:-.32,k:170},
  e_nexus_ha:{a:'nexus',b:'ha',dot:1,arrow:'end',sa:'r',sb:'l',ob:-.12},

  e_dist_otros:{a:'dist',b:'otros',arrow:'end',oa:.2,sb:'b'},

  e_garec_beta:{a:'garec',b:'beta',arrow:'end',oa:-.05},
  e_oracle_dist:{a:'oracle',b:'dist',arrow:'end',sa:'t',sb:'b',ob:-.22},
  e_sf_dist:{a:'sf',b:'dist',arrow:'end',sa:'t',sb:'b',ob:.22},

  g_ha_teams:{a:'ha',b:'teams',ghost:1,arrow:'end',sa:'r',sb:'l',oa:.35,ob:-.2,k:260},
  g_ola_teams:{a:'ola',b:'teams',ghost:1,arrow:'end',sa:'r',sb:'l',oa:.3,ob:.2},

};

const SEV = {crit:{l:'Crítico',w:3},alto:{l:'Alto',w:2},medio:{l:'Medio',w:1}};

/* nodes = implicados; ctx = contexto del flujo; e = conexiones que se resaltan */

 {id:'p1',t:'Herramientas de terceros no conectadas por API',sev:'alto',ph:[2],

 {id:'p3',t:'Uso sistemático de Excel para incorporar datos',sev:'crit',ph:[2],

  e:[]},
 {id:'p4',t:'Contenido base generado y guardado fuera del ecosistema',sev:'alto',ph:[1,2],

  nodes:['gade','ha','ola','mem','nexus'],ctx:['a2r','prog','vimeo'],
  e:['e_gade_a2r','g_gade_nexus','e_nexus_ha','g_mem_vimeo','g_vimeo_ha','e_mem_ha','e_prog_mem','e_gade_ha','e_ha_ola']},
 {id:'p5',t:'Limitaciones de las herramientas de gestión (Oracle)',sev:'alto',ph:[1,3],
  d:'Ingeniería obsoleta de Oracle.',
  why:'Complica el licenciamiento digital. Cada vez surgen más oportunidades fuera de las reglas de negocio del sistema: apertura a LATAM, venta en academias o a usuarios no perfilados.',
  nodes:['oracle','sf','ha','ola'],ctx:['dist','ccaa','otros'],
  e:['e_oracle_dist','e_sf_dist','e_ha_dist','e_ha_ola','e_dist_ccaa','e_dist_otros']},
 {id:'p6',t:'Uso sistemático de Excel en el seguimiento',sev:'crit',ph:[1,2],
  d:'El seguimiento de la generación de recursos y del montaje de productos digitales se hace con Excel que reportan a Power BI.',
  why:'Inestabilidad del fichero fuente de datos y riesgo de errores por el ingreso manual de la información.',
  nodes:['ha','ola','powerbi','teams'],ctx:[],
  e:['g_ha_teams','g_ola_teams']},
 {id:'p7',t:'Retraso del ecosistema como distribuidor de contenidos de terceros',sev:'medio',ph:[3],
  d:'La acumulación de tareas priorizadas para el año 2 impide acelerar el proceso. Ese año incluso sería arriesgado abandonar BETA, porque el ecosistema aún no estará estabilizado.',
  why:'Retraso en la tracción de usuarios desde Blink.',
  nodes:['ola','beta','garec'],ctx:['dist','blink'],
  e:['e_garec_beta','e_dist_beta','g_blink_ola']}
];
PAINS.sort((a,b)=>SEV[b.sev].w-SEV[a.sev].w); // de mayor a menor criticidad

const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map');
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const label=n=>n.l.replace(/\n/g,' ');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RX=n=>Math.min(n.h/2,22);

// zona OLA
const gZ=el('g',{class:'zone'},svg);
el('rect',{x:ZONE.x,y:ZONE.y,width:ZONE.w,height:ZONE.h,rx:36},gZ);
el('text',{x:ZONE.x+28,y:ZONE.y+52},gZ).textContent=ZONE.l;

// geometría de conexiones: salen y llegan por el centro de un lado, con curvas suaves
const DIR={l:[-1,0],r:[1,0],t:[0,-1],b:[0,1]};
function anchor(n,side,off=0){const g=5;
  if(side==='l')return [n.x-n.w/2-g,n.y+off*n.h];
  if(side==='r')return [n.x+n.w/2+g,n.y+off*n.h];
  if(side==='t')return [n.x+off*n.w,n.y-n.h/2-g];
  return [n.x+off*n.w,n.y+n.h/2+g];}
function sides(A,B){const dx=B.x-A.x,dy=B.y-A.y;
  return Math.abs(dx)>Math.abs(dy)*1.1?(dx>0?['r','l']:['l','r']):(dy>0?['b','t']:['t','b']);}
function arrowAt(p,d,g){const len=17,w=8,ux=-d[0],uy=-d[1];
  el('polygon',{points:`${p[0]},${p[1]} ${p[0]-ux*len-uy*w},${p[1]-uy*len+ux*w} ${p[0]-ux*len+uy*w},${p[1]-uy*len-ux*w}`},g);}

const gE=el('g',{},svg), gN=el('g',{},svg);
const edgeEls={}, nodeEls={};
for(const id in EDGES){const e=EDGES[id],A=NODES[e.a],B=NODES[e.b];
  const auto=sides(A,B),sa=e.sa||auto[0],sb=e.sb||auto[1];
  const s=anchor(A,sa,e.oa||0),t=anchor(B,sb,e.ob||0),da=DIR[sa],db=DIR[sb];
  const dist=Math.hypot(t[0]-s[0],t[1]-s[1]),k=e.k||Math.max(30,Math.min(180,dist*.42));
  const trimS=e.arrow==='both'?12:0,trimT=e.arrow==='none'?0:12;
  const s2=[s[0]+da[0]*trimS,s[1]+da[1]*trimS],t2=[t[0]+db[0]*trimT,t[1]+db[1]*trimT];
  const c1=[s[0]+da[0]*k,s[1]+da[1]*k],c2=[t[0]+db[0]*k,t[1]+db[1]*k];
  const g=el('g',{class:'edge'+(e.dot?' dot':'')+(e.ghost?' ghost':'')},gE);
  el('path',{d:`M${s2} C${c1} ${c2} ${t2}`},g);
  if(e.arrow!=='none')arrowAt(t,db,g);
  if(e.arrow==='both')arrowAt(s,da,g);
  edgeEls[id]={g};
}
for(const id in NODES){const n=NODES[id],rx=RX(n);
  const g=el('g',{class:'node'+(n.big?' big':'')+(n.ghost?' ghost':''),tabindex:n.ghost?-1:0,role:'button','aria-label':label(n),style:`--nc:var(${n.c})`},gN);
  el('rect',{class:'halo',x:n.x-n.w/2-11,y:n.y-n.h/2-11,width:n.w+22,height:n.h+22,rx:rx+11},g);
  el('rect',{class:'body',x:n.x-n.w/2,y:n.y-n.h/2,width:n.w,height:n.h,rx},g);
  el('rect',{class:'cap',x:n.x-n.w*.18,y:n.y-n.h/2+7,width:n.w*.36,height:5,rx:2.5},g);
  const lines=n.l.split('\n'),lh=FS*1.18,y0=n.y-(lines.length-1)*lh/2+FS*0.36+3;
  const tx=el('text',{'text-anchor':'middle','font-size':FS},g);
  lines.forEach((l,i)=>{const ts=el('tspan',{x:n.x,y:y0+i*lh},tx);ts.textContent=l;});
  const b=el('g',{class:'badge'},g);
  const bx=n.x+n.w/2-10,by=n.y-n.h/2-2;
  el('rect',{x:bx-17,y:by-15,width:34,height:30,rx:15},b);const bt=el('text',{x:bx,y:by+7,'text-anchor':'middle'},b);
  nodeEls[id]={g,bt,b};
  if(!n.ghost){g.addEventListener('click',()=>toggleNode(id));
    g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggleNode(id);}});}
}

// ---- estado
const S={open:false,sel:null,phase:null,node:null};
try{const h=location.hash.slice(1);if(PAINS.some(p=>p.id===h)){S.sel=h;S.open=true;}}catch(e){}

const inPhase=p=>!S.phase||p.ph.includes(S.phase);
const visible=()=>PAINS.filter(p=>inPhase(p)&&(!S.node||p.nodes.includes(S.node)||p.ctx.includes(S.node)));
const pain=()=>S.open?PAINS.find(p=>p.id===S.sel):null;

document.getElementById('toggle').onclick=()=>{S.open=!S.open;if(!S.open){S.sel=null;S.node=null;S.phase=null;}render();};
function toggleNode(id){S.open=true;S.node=S.node===id?null:id;if(S.sel&&!visible().some(p=>p.id===S.sel))S.sel=null;render();}

// pestañas de fase
const tabs=document.getElementById('tabs');
function renderTabs(){tabs.innerHTML='';
  [null,1,2,3,4].forEach(v=>{const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');
    b.setAttribute('aria-selected',String(S.phase===v));b.tabIndex=S.phase===v?0:-1;
    const n=v?PAINS.filter(p=>p.ph.includes(v)).length:PAINS.length;
    b.innerHTML=v?`<span class="k">${v}</span>${PHASES[v].s}<span class="n">${n}</span>`:`Todas las fases<span class="n">${n}</span>`;
    b.onclick=()=>setPhase(v);
    b.onkeydown=e=>{const order=[null,1,2,3,4],i=order.indexOf(S.phase);
      if(e.key==='ArrowRight'){e.preventDefault();setPhase(order[(i+1)%5]);tabs.querySelector('[aria-selected="true"]').focus();}
      if(e.key==='ArrowLeft'){e.preventDefault();setPhase(order[(i+4)%5]);tabs.querySelector('[aria-selected="true"]').focus();}};
    tabs.appendChild(b);});
  document.getElementById('phasedesc').textContent=S.phase?PHASES[S.phase].l:'';}
function setPhase(v){S.phase=v;if(S.sel&&!visible().some(p=>p.id===S.sel))S.sel=null;render();}

function chips(ids,ctx){return ids.map(n=>`<span class="chip${ctx?' ctx':''}" style="--nc:var(${NODES[n].c})">${esc(label(NODES[n]))}</span>`).join('');}
const CHEV='<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// ---- lista desplegable
function renderCards(){
  const list=visible(),box=document.getElementById('cards');box.innerHTML='';
  document.getElementById('listcount').textContent=S.open&&list.length!==PAINS.length?`${list.length} de ${PAINS.length}`:PAINS.length;
  const nf=document.getElementById('nodefilter');nf.innerHTML='';
  if(S.node){const c=document.createElement('span');c.className='nodechip';c.textContent=label(NODES[S.node]);
    const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Quitar filtro');x.onclick=()=>{S.node=null;render();};c.appendChild(x);nf.appendChild(c);}
  if(!list.length){const e=document.createElement('div');e.className='empty';
    e.textContent=S.phase===4&&!S.node?'El documento todavía no recoge puntos de dolor para la fase 4.':'Ningún punto de dolor coincide con este filtro.';box.appendChild(e);return;}
  list.forEach(p=>{const open=S.sel===p.id;
    const card=document.createElement('div');card.className='card sev-'+p.sev+(open?' open':'');
    card.innerHTML=`<button class="card-head" aria-expanded="${open}" aria-controls="body-${p.id}">
        <span class="t">${esc(p.t)}</span><span class="chev">${CHEV}</span>
        <span class="meta"><span class="sevtag">${SEV[p.sev].l}</span>${p.ph.map(f=>`<span class="tag">Fase ${f}</span>`).join('')}<span class="tag">${p.nodes.length} elem.</span></span>
      </button>`;
    card.querySelector('.card-head').onclick=()=>{S.sel=open?null:p.id;render();if(!open)requestAnimationFrame(()=>{const c=document.querySelector('.card.open');if(c&&c.getBoundingClientRect().top<0)c.scrollIntoView({block:'start',behavior:'smooth'});});};
    if(open){const b=document.createElement('div');b.className='card-body';b.id='body-'+p.id;
      b.innerHTML=`<h3>Descripción</h3><p>${esc(p.d)}</p>
        <h3>Por qué es un problema</h3><p class="why">${esc(p.why)}</p>
        <h3>Elementos implicados</h3><div class="chips">${chips(p.nodes)}</div>
        ${p.ctx.length?`<h3>Contexto del flujo</h3><div class="chips">${chips(p.ctx,1)}</div>`:''}`;
      card.appendChild(b);}
    box.appendChild(card);});
}

// ---- esquema
function renderMap(){
  const p=pain();
  svg.setAttribute('class',(p?'sel sev-'+p.sev:'')+(S.node?' focusnode':'')+(S.open?' counts':''));
  const on=new Set(p?p.e:[]);
  for(const id in edgeEls)edgeEls[id].g.classList.toggle('on',on.has(id));
  const count={};visible().forEach(q=>q.nodes.forEach(n=>{count[n]=(count[n]||0)+1;}));
  for(const id in nodeEls){const {g,bt,b}=nodeEls[id];
    g.classList.toggle('primary',!!p&&p.nodes.includes(id));
    g.classList.toggle('context',!!p&&p.ctx.includes(id));
    g.classList.toggle('nodefocus',S.node===id);
    b.style.display=count[id]&&!NODES[id].ghost?'':'none';bt.textContent=count[id]||'';
    g.style.setProperty('--sev',p?`var(--${p.sev})`:'transparent');
  }
  svg.style.setProperty('--sev',p?`var(--${p.sev})`:'var(--accent)');
}

function render(){
  const t=document.getElementById('toggle');t.setAttribute('aria-expanded',String(S.open));
  document.getElementById('list').hidden=!S.open;
  document.getElementById('phasebar').hidden=!S.open;
  document.getElementById('app').classList.toggle('open',S.open);
  renderTabs();renderCards();renderMap();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sel){S.sel=null;render();}});
render();
})();
</script>
</body></html>
